<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/galeria.css">
    <title>Galería - I.E.P.S.M. N° 10187 "El Virrey"</title>
</head>

<body>
    <div id="header"></div>

    <main>
        <!-- Hero -->
        <section class="hero-pagina fade-in text-center">
            <h1 class="hero-titulo">GALERÍA DE FOTOS</h1>
            <div class="hero-linea mx-auto"></div>
        </section>

        <!-- Categorías (cada una abre el modal único de galería) -->
        <section class="container categorias-galeria-section">
            <div class="row g-3" id="galeriaGrid">
                <!-- Las tarjetas se generan automáticamente desde js/galeria-data.js -->
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <!-- ============================
         Modal único: se llena dinámicamente según la categoría clickeada
         ============================ -->
    <div class="modal fade" id="modalGaleria" tabindex="-1" aria-labelledby="modalGaleriaLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <button type="button" class="btn-close modal-cerrar-flotante" data-bs-dismiss="modal"
                    aria-label="Cerrar"></button>
                <h2 id="modalGaleriaLabel" class="visually-hidden">Galería</h2>
                <div id="carruselGaleria" class="carousel slide">
                    <div class="carousel-inner" id="carruselGaleriaInner"></div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carruselGaleria"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carruselGaleria"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/includes.js"></script>
    <script src="js/galeria.js"></script>
    <script src="js/buscador.js"></script>
</body>

</html>
