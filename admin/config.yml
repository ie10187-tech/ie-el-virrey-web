backend:
  name: git-gateway
  branch: main

media_folder: "img/uploads"
public_folder: "/img/uploads"

collections:

  # ─────────────────────────────────────────
  # ALERTA / AVISO BARRA SUPERIOR
  # ─────────────────────────────────────────
  - name: "alerta"
    label: "🚨 Alerta — Barra superior"
    files:
      - name: "configuracion"
        label: "Configurar aviso de la barra superior"
        file: "data/alerta.json"
        fields:
          - { name: "activa", label: "¿Mostrar la barra de alerta?", widget: "boolean", default: false }
          - name: "tipo"
            label: "Color de la alerta"
            widget: "select"
            options:
              - { label: "🔴 Emergencia (rojo/oscuro)", value: "emergencia" }
              - { label: "🔵 Informativo (azul)", value: "informativo" }
              - { label: "🟡 Evento (dorado)", value: "evento" }
          - name: "icono"
            label: "Ícono (Bootstrap Icons)"
            widget: "select"
            options:
              - { label: "⚠️ Triángulo de advertencia", value: "bi-exclamation-triangle-fill" }
              - { label: "ℹ️ Información", value: "bi-info-circle-fill" }
              - { label: "🌧️ Lluvia / El Niño", value: "bi-cloud-rain-heavy-fill" }
              - { label: "📢 Megáfono", value: "bi-megaphone-fill" }
              - { label: "📅 Calendario", value: "bi-calendar-event-fill" }
              - { label: "⭐ Estrella", value: "bi-star-fill" }
          - { name: "etiqueta", label: "Etiqueta izquierda (ej: AVISO IMPORTANTE)", widget: "string" }
          - { name: "texto", label: "Mensaje que se desplaza en la barra", widget: "string" }
          - { name: "url_destino", label: "Página de destino al hacer clic (ej: aviso-institucional.html)", widget: "string" }
          - { name: "url_label", label: "Texto del botón derecho (ej: Ver más)", widget: "string", default: "Ver más" }
          - { name: "vigencia", label: "Fecha de vigencia — se oculta automáticamente después (AAAA-MM-DD)", widget: "string" }

  # ─────────────────────────────────────────
  # AVISO INSTITUCIONAL (Fenómeno El Niño)
  # ─────────────────────────────────────────
  - name: "aviso_institucional"
    label: "📋 Aviso Institucional — Cronograma y documentos"
    files:
      - name: "contenido"
        label: "Fecha, cronograma y documentos oficiales"
        file: "data/aviso-institucional.json"
        fields:
          - { name: "fecha_actualizacion", label: "Fecha de última actualización (ej: 30 de julio de 2026)", widget: "string" }
          - { name: "referencia_oficio", label: "Número de oficio de referencia", widget: "string" }
          - name: "cronograma"
            label: "Tabla de cronograma escolar"
            widget: "list"
            summary: "{{fields.bloque}}"
            fields:
              - { name: "bloque", label: "Bloque / Periodo (ej: III Bimestre)", widget: "string" }
              - { name: "inicio", label: "Fecha de inicio (DD/MM/AAAA)", widget: "string" }
              - { name: "termino", label: "Fecha de término (DD/MM/AAAA)", widget: "string" }
              - { name: "semanas", label: "N° de semanas (ej: 09 semanas)", widget: "string" }
              - { name: "observacion", label: "Observaciones", widget: "text" }
          - name: "documentos"
            label: "Documentos oficiales (tarjetas PDF)"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - { name: "titulo", label: "Título del documento", widget: "string" }
              - { name: "fecha", label: "Fecha de publicación (ej: 24 de julio de 2026)", widget: "string" }
              - name: "modal"
                label: "Modal PDF que abre (no cambiar salvo que agregues uno nuevo)"
                widget: "select"
                options:
                  - { label: "PDF 1", value: "modalPdf1" }
                  - { label: "PDF 2", value: "modalPdf2" }
                  - { label: "PDF 3", value: "modalPdf3" }
                  - { label: "PDF 4", value: "modalPdf4" }

  # ─────────────────────────────────────────
  # LOGROS DESTACADOS (inicio)
  # ─────────────────────────────────────────
  - name: "logros"
    label: "🏆 Logros Destacados — Portada"
    files:
      - name: "listado"
        label: "Tarjetas de logros en portada"
        file: "data/logros.json"
        fields:
          - name: "logros"
            label: "Logros (máximo 4 recomendado)"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - name: "icono"
                label: "Ícono"
                widget: "select"
                options:
                  - { label: "🏆 Trofeo", value: "bi-trophy-fill" }
                  - { label: "🤖 Robótica", value: "bi-robot" }
                  - { label: "🎵 Música / Marinera", value: "bi-music-note-beamed" }
                  - { label: "⭐ Estrella", value: "bi-star-fill" }
                  - { label: "📚 Libro", value: "bi-book-fill" }
                  - { label: "🏅 Medalla / Premio", value: "bi-award-fill" }
                  - { label: "🎨 Arte", value: "bi-palette-fill" }
                  - { label: "⚽ Deporte", value: "bi-dribbble" }
              - { name: "titulo", label: "Título del logro (en MAYÚSCULAS)", widget: "string" }
              - { name: "texto", label: "Descripción breve", widget: "string" }

  # ─────────────────────────────────────────
  # VIDA ESCOLAR (galería portada)
  # ─────────────────────────────────────────
  - name: "vida_escolar"
    label: "📷 Vida Escolar — Fotos en portada"
    files:
      - name: "listado"
        label: "Fotos de vida escolar (portada)"
        file: "data/vida-escolar.json"
        fields:
          - name: "items"
            label: "Fotos (máximo 4)"
            widget: "list"
            summary: "{{fields.etiqueta}}"
            fields:
              - { name: "imagen", label: "Foto", widget: "image" }
              - { name: "alt", label: "Descripción para accesibilidad (ej: Estudiantes en laboratorio)", widget: "string" }
              - { name: "etiqueta", label: "Etiqueta visible sobre la foto (ej: Ciencias)", widget: "string" }

  # ─────────────────────────────────────────
  # AVISOS Y COMUNICADOS (portada)
  # ─────────────────────────────────────────
  - name: "avisos"
    label: "📣 Avisos y Comunicados — Portada"
    files:
      - name: "listado"
        label: "Tarjetas de avisos en portada"
        file: "data/avisos.json"
        fields:
          - name: "avisos"
            label: "Avisos (máximo 3 recomendado)"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - { name: "titulo", label: "Título del aviso", widget: "string" }
              - { name: "texto", label: "Resumen (aparece en la tarjeta)", widget: "text" }
              - name: "detalle"
                label: "Texto completo (opcional — aparece en modal al hacer clic en 'Ver detalle')"
                widget: "text"
                required: false

  # ─────────────────────────────────────────
  # PÁGINA: CONOCE MÁS
  # ─────────────────────────────────────────
  - name: "conoce_mas"
    label: "🏫 Página: Conoce Más"
    files:
      - name: "contenido"
        label: "Razones y accesos rápidos"
        file: "data/conoce-mas.json"
        fields:
          - name: "razones"
            label: "¿Por qué elegirnos? (tarjetas de razones)"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - name: "icono"
                label: "Ícono"
                widget: "select"
                options:
                  - { label: "🎓 Birrete", value: "bi-mortarboard-fill" }
                  - { label: "❤️ Corazón / Valores", value: "bi-heart-fill" }
                  - { label: "👥 Personas / Docentes", value: "bi-people-fill" }
                  - { label: "🏫 Edificio / Infraestructura", value: "bi-buildings-fill" }
                  - { label: "⭐ Estrella", value: "bi-star-fill" }
                  - { label: "🌱 Naturaleza", value: "bi-tree-fill" }
                  - { label: "📚 Libro", value: "bi-book-fill" }
                  - { label: "🏅 Premio", value: "bi-award-fill" }
              - { name: "titulo", label: "Título de la razón", widget: "string" }
              - { name: "texto", label: "Descripción", widget: "text" }
          - name: "accesos"
            label: "Accesos rápidos (tarjetas con foto)"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - { name: "imagen", label: "Foto de fondo", widget: "image" }
              - { name: "alt", label: "Descripción de la foto (accesibilidad)", widget: "string" }
              - { name: "titulo", label: "Título de la sección (en MAYÚSCULAS)", widget: "string" }
              - { name: "texto", label: "Descripción breve", widget: "text" }
              - { name: "url", label: "Enlace de destino (ej: nosotros.html)", widget: "string" }

  # ─────────────────────────────────────────
  # NOTICIAS
  # ─────────────────────────────────────────
  - name: "noticias"
    label: "📰 Noticias"
    files:
      - name: "listado"
        label: "Listado de noticias"
        file: "data/noticias.json"
        fields:
          - name: "noticias"
            label: "Noticias"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - { name: "id", label: "ID interno (sin espacios ni tildes, ej: jornada-arborizacion)", widget: "string" }
              - { name: "titulo", label: "Título", widget: "string" }
              - { name: "fecha", label: "Fecha (ej: 15 de mayo, 2024)", widget: "string" }
              - name: "categoria"
                label: "Categoría"
                widget: "select"
                options:
                  - { label: "Eventos", value: "eventos" }
                  - { label: "Logros", value: "logros" }
                  - { label: "Comunicados", value: "comunicados" }
              - { name: "imagen", label: "Imagen principal", widget: "image" }
              - { name: "resumen", label: "Resumen corto (para la tarjeta de la lista)", widget: "text" }
              - name: "contenido"
                label: "Contenido completo (un párrafo por línea)"
                widget: "list"
                field: { name: "parrafo", label: "Párrafo", widget: "text" }
              - name: "galeria"
                label: "Galería de fotos (opcional)"
                widget: "list"
                required: false
                fields:
                  - { name: "src", label: "Imagen", widget: "image" }
                  - { name: "alt", label: "Descripción de la imagen", widget: "string" }

  # ─────────────────────────────────────────
  # BUSCADOR — mapa de secciones del sitio
  # ─────────────────────────────────────────
  - name: "buscador"
    label: "🔍 Buscador — Secciones del sitio"
    files:
      - name: "mapa"
        label: "Secciones que aparecen en el buscador del header"
        file: "data/mapa-sitio.json"
        fields:
          - name: "secciones"
            label: "Secciones"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - { name: "titulo", label: "Nombre de la sección (ej: Galería)", widget: "string" }
              - { name: "url", label: "Enlace (ej: galeria.html)", widget: "string" }
              - name: "keywords"
                label: "Palabras clave"
                widget: "list"
                field: { name: "palabra", label: "Palabra clave", widget: "string" }

  # ─────────────────────────────────────────
  # GALERÍA — Categorías y fotos
  # ─────────────────────────────────────────
  - name: "galeria"
    label: "🖼️ Galería — Categorías y fotos"
    files:
      - name: "deportes"
        label: "Categoría: Deportes"
        file: "data/galeria.json"
        fields:
          - name: "categorias"
            label: "Categorías"
            widget: "object"
            fields:
              - name: "deportes"
                label: "Deportes"
                widget: "object"
                fields:
                  - { name: "label", label: "Nombre visible de la categoría", widget: "string" }
                  - { name: "portada", label: "Foto de portada", widget: "image" }
                  - name: "fotos"
                    label: "Fotos"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "caption", label: "Descripción de la foto", widget: "string" }
      - name: "ciencias"
        label: "Categoría: Ciencias"
        file: "data/galeria.json"
        fields:
          - name: "categorias"
            label: "Categorías"
            widget: "object"
            fields:
              - name: "ciencias"
                label: "Ciencias"
                widget: "object"
                fields:
                  - { name: "label", label: "Nombre visible de la categoría", widget: "string" }
                  - { name: "portada", label: "Foto de portada", widget: "image" }
                  - name: "fotos"
                    label: "Fotos"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "caption", label: "Descripción de la foto", widget: "string" }
      - name: "cultura"
        label: "Categoría: Cultura"
        file: "data/galeria.json"
        fields:
          - name: "categorias"
            label: "Categorías"
            widget: "object"
            fields:
              - name: "cultura"
                label: "Cultura"
                widget: "object"
                fields:
                  - { name: "label", label: "Nombre visible de la categoría", widget: "string" }
                  - { name: "portada", label: "Foto de portada", widget: "image" }
                  - name: "fotos"
                    label: "Fotos"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "caption", label: "Descripción de la foto", widget: "string" }
      - name: "patio"
        label: "Categoría: Patio y Recreo"
        file: "data/galeria.json"
        fields:
          - name: "categorias"
            label: "Categorías"
            widget: "object"
            fields:
              - name: "patio"
                label: "Patio y Recreo"
                widget: "object"
                fields:
                  - { name: "label", label: "Nombre visible de la categoría", widget: "string" }
                  - { name: "portada", label: "Foto de portada", widget: "image" }
                  - name: "fotos"
                    label: "Fotos"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "caption", label: "Descripción de la foto", widget: "string" }
      - name: "robotica"
        label: "Categoría: Robótica"
        file: "data/galeria.json"
        fields:
          - name: "categorias"
            label: "Categorías"
            widget: "object"
            fields:
              - name: "robotica"
                label: "Robótica"
                widget: "object"
                fields:
                  - { name: "label", label: "Nombre visible de la categoría", widget: "string" }
                  - { name: "portada", label: "Foto de portada", widget: "image" }
                  - name: "fotos"
                    label: "Fotos"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "caption", label: "Descripción de la foto", widget: "string" }
      - name: "eventos"
        label: "Categoría: Eventos"
        file: "data/galeria.json"
        fields:
          - name: "categorias"
            label: "Categorías"
            widget: "object"
            fields:
              - name: "eventos"
                label: "Eventos"
                widget: "object"
                fields:
                  - { name: "label", label: "Nombre visible de la categoría", widget: "string" }
                  - { name: "portada", label: "Foto de portada", widget: "image" }
                  - name: "fotos"
                    label: "Fotos"
                    widget: "list"
                    summary: "{{fields.caption}}"
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "caption", label: "Descripción de la foto", widget: "string" }

  # ─────────────────────────────────────────
  # CURSOS — PRIMARIA
  # ─────────────────────────────────────────
  - name: "cursos_primaria"
    label: "📚 Cursos — Primaria"
    files:
      - name: "comunicacion_p"
        label: "Comunicación"
        file: "data/cursos.json"
        fields:
          - name: "primaria"
            label: "Primaria"
            widget: "object"
            fields:
              - name: "comunicacion"
                label: "Comunicación"
                widget: "object"
                fields:
                  - { name: "titulo", label: "Título del área", widget: "string" }
                  - { name: "grados", label: "Grados (ej: 1° a 6° grado)", widget: "string" }
                  - name: "descripcion"
                    label: "Párrafos de descripción"
                    widget: "list"
                    field: { name: "parrafo", label: "Párrafo", widget: "text" }
                  - name: "galeria"
                    label: "Galería de fotos (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "alt", label: "Descripción", widget: "string" }
                  - name: "pdfs"
                    label: "Documentos PDF (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "titulo", label: "Título del documento", widget: "string" }
                      - { name: "fecha", label: "Fecha de publicación", widget: "string" }
                      - { name: "archivo", label: "Archivo PDF", widget: "file" }
      - name: "matematica_p"
        label: "Matemática"
        file: "data/cursos.json"
        fields:
          - name: "primaria"
            label: "Primaria"
            widget: "object"
            fields:
              - name: "matematica"
                label: "Matemática"
                widget: "object"
                fields:
                  - { name: "titulo", label: "Título del área", widget: "string" }
                  - { name: "grados", label: "Grados", widget: "string" }
                  - name: "descripcion"
                    label: "Párrafos de descripción"
                    widget: "list"
                    field: { name: "parrafo", label: "Párrafo", widget: "text" }
                  - name: "galeria"
                    label: "Galería de fotos (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "alt", label: "Descripción", widget: "string" }
                  - name: "pdfs"
                    label: "Documentos PDF (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "titulo", label: "Título del documento", widget: "string" }
                      - { name: "fecha", label: "Fecha de publicación", widget: "string" }
                      - { name: "archivo", label: "Archivo PDF", widget: "file" }
      - name: "personal_social_p"
        label: "Personal Social"
        file: "data/cursos.json"
        fields:
          - name: "primaria"
            label: "Primaria"
            widget: "object"
            fields:
              - name: "personal-social"
                label: "Personal Social"
                widget: "object"
                fields:
                  - { name: "titulo", label: "Título del área", widget: "string" }
                  - { name: "grados", label: "Grados", widget: "string" }
                  - name: "descripcion"
                    label: "Párrafos de descripción"
                    widget: "list"
                    field: { name: "parrafo", label: "Párrafo", widget: "text" }
                  - name: "galeria"
                    label: "Galería de fotos (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "alt", label: "Descripción", widget: "string" }
                  - name: "pdfs"
                    label: "Documentos PDF (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "titulo", label: "Título del documento", widget: "string" }
                      - { name: "fecha", label: "Fecha de publicación", widget: "string" }
                      - { name: "archivo", label: "Archivo PDF", widget: "file" }
      - name: "ciencia_tecnologia_p"
        label: "Ciencia y Tecnología"
        file: "data/cursos.json"
        fields:
          - name: "primaria"
            label: "Primaria"
            widget: "object"
            fields:
              - name: "ciencia-tecnologia"
                label: "Ciencia y Tecnología"
                widget: "object"
                fields:
                  - { name: "titulo", label: "Título del área", widget: "string" }
                  - { name: "grados", label: "Grados", widget: "string" }
                  - name: "descripcion"
                    label: "Párrafos de descripción"
                    widget: "list"
                    field: { name: "parrafo", label: "Párrafo", widget: "text" }
                  - name: "galeria"
                    label: "Galería de fotos (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "alt", label: "Descripción", widget: "string" }
                  - name: "pdfs"
                    label: "Documentos PDF (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "titulo", label: "Título del documento", widget: "string" }
                      - { name: "fecha", label: "Fecha de publicación", widget: "string" }
                      - { name: "archivo", label: "Archivo PDF", widget: "file" }
      - name: "educacion_fisica_p"
        label: "Educación Física"
        file: "data/cursos.json"
        fields:
          - name: "primaria"
            label: "Primaria"
            widget: "object"
            fields:
              - name: "educacion-fisica"
                label: "Educación Física"
                widget: "object"
                fields:
                  - { name: "titulo", label: "Título del área", widget: "string" }
                  - { name: "grados", label: "Grados", widget: "string" }
                  - name: "descripcion"
                    label: "Párrafos de descripción"
                    widget: "list"
                    field: { name: "parrafo", label: "Párrafo", widget: "text" }
                  - name: "galeria"
                    label: "Galería de fotos (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "src", label: "Foto", widget: "image" }
                      - { name: "alt", label: "Descripción", widget: "string" }
                  - name: "pdfs"
                    label: "Documentos PDF (opcional)"
                    widget: "list"
                    required: false
                    fields:
                      - { name: "titulo", label: "Título del documento", widget: "string" }
                      - { name: "fecha", label: "Fecha de publicación", widget: "string" }
                      - { name: "archivo", label: "Archivo PDF", widget: "file" }
      - name: "arte_cultura_p"
        label: "Arte y Cultura"
        file: "data/cursos.json"
        fields:
          - name: "primaria"
            label: "Primaria"
            widget: "object"
            fields:
              - name: "arte-cultura"
                label: "Arte y Cultura"
                widget: "object"
                fields:
                  - { name: "titulo", label: "Título del área", widget: "string" }
                  - { name: "grados", label: "Grados", widget: "string" }
                  - name: "descripcion"
                    label: "Párrafos de descripción"
                    widget: "list"
                    field: { name: "parrafo", label: "Párrafo", widget: "text" }
