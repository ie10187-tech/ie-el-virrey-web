<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/header-footer.css">
    <link rel="stylesheet" href="css/preguntas-frecuentes.css">
    <title>Preguntas Frecuentes - I.E.P.S.M. N° 10187 "El Virrey"</title>
</head>

<body>
    <div id="header"></div>

    <main>
        <!-- Hero -->
        <section class="hero-pagina fade-in text-center">
            <h1 class="hero-titulo">PREGUNTAS FRECUENTES</h1>
            <div class="hero-linea mx-auto"></div>
        </section>

        <!-- Buscador de preguntas -->
        <section class="container faq-buscador-section">
            <div class="faq-buscador">
                <i class="bi bi-search faq-buscador-icono"></i>
                <input type="text" id="buscadorFaq" class="form-control" placeholder="Busca tu pregunta aquí...">
            </div>
        </section>

        <!-- Cinta de categorías -->
        <section class="container filtros-section">
            <div class="filtros-cinta" data-items=".faq-item" data-vacio="#sinResultadosFaq"
                data-buscador="#buscadorFaq">
                <button class="filtro-chip active" data-filtro="todas">Todas</button>
                <button class="filtro-chip" data-filtro="admision">Admisión y Matrícula</button>
                <button class="filtro-chip" data-filtro="academico">Académico</button>
                <button class="filtro-chip" data-filtro="pagos">Pagos</button>
                <button class="filtro-chip" data-filtro="general">General</button>
            </div>
        </section>

        <!-- Acordeón de preguntas — dinámico desde data/faq.json -->
        <section class="container faq-contenido-section">
            <div class="accordion" id="acordeonFaq"></div>

            <p id="sinResultadosFaq" class="sin-resultados d-none">No encontramos preguntas que coincidan con tu
                búsqueda.</p>
        </section>

        <!-- CTA: no encontró su respuesta -->
        <section class="container faq-cta-section">
            <div class="faq-cta-card text-center">
                <i class="bi bi-chat-dots-fill"></i>
                <h2 class="faq-cta-titulo">¿No encontraste lo que buscabas?</h2>
                <p class="faq-cta-texto">Escríbenos directamente y con gusto te ayudaremos.</p>
                <a href="contacto.html" class="btn btn-institucional-fill rounded-pill px-4">CONTÁCTANOS</a>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/includes.js"></script>
    <script src="js/filtro.js"></script>
    <script src="js/faq-dinamico.js"></script>
</body>

</html>
